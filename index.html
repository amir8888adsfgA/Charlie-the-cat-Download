<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orange Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
            position: relative;
        }

        body.light-theme {
            background: linear-gradient(135deg, #FFE680 0%, #FFEB3B 100%);
            color: #333;
        }

        body.light-theme::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #FFD166 0%, #FF9F1C 100%);
            opacity: 0;
            animation: warm-shift 12s ease-in-out infinite;
            z-index: -1;
        }

        body.dark-theme {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #f0f0f0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Vertical lines */
        .left-line, .right-line {
            position: fixed;
            width: 6px;
            height: 100%;
            top: 0;
        }

        .left-line {
            left: 0;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.3);
            background: #FFEB3B;
        }

        .right-line {
            right: 0;
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.3);
            background: #FFEB3B;
        }

        body.dark-theme .left-line,
        body.dark-theme .right-line {
            background: #FFEB3B;
        }

        /* Header */
        header {
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 40px;
            border-left: 8px solid #FFEB3B;
            border-right: 8px solid #FFEB3B;
            background: rgba(255, 253, 230, 0.98);
            transition: background 0.3s ease;
        }

        body.dark-theme header {
            background: rgba(50, 50, 50, 0.95);
            border-left-color: #FFEB3B;
            border-right-color: #FFEB3B;
        }

        h1 {
            color: #FFEB3B;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #FFD700;
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        body.dark-theme .subtitle {
            color: #FFF9E6;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-control {
            background: linear-gradient(135deg, #FFF9E6 0%, #FFEB3B 100%);
            color: #333;
            border: 2px solid #FFEB3B;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.95em;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 5px 15px rgba(255, 235, 59, 0.3);
        }

        body.dark-theme .btn-control {
            background: linear-gradient(135deg, #FFEB3B 0%, #FFD700 100%);
            color: #333;
        }

        .btn-control:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 235, 59, 0.5);
        }

        .btn-control:active {
            transform: scale(0.98);
        }

        /* Main content */
        main {
            display: flex;
            gap: 30px;
            margin-bottom: 40px;
            align-items: flex-start;
        }

        .content-wrapper {
            flex: 1;
        }

        .image-wrapper {
            flex-shrink: 0;
            width: 300px;
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .card {
            background: #FFFEF5;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            border-top: 5px solid #FFEB3B;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
        }

        body.dark-theme .card {
            background: #2d2d2d;
            border-top-color: #FFEB3B;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            color: #FFEB3B;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .card p {
            color: #555;
            line-height: 1.6;
        }

        body.dark-theme .card p {
            color: #ddd;
        }

        /* Button */
        button {
            background: linear-gradient(135deg, #FFF9E6 0%, #FFEB3B 100%);
            color: #333;
            border: 2px solid #FFEB3B;
            padding: 14px 35px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 235, 59, 0.3);
            position: relative;
            overflow: hidden;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        button:hover::before {
            width: 300px;
            height: 300px;
        }

        body.dark-theme button {
            background: linear-gradient(135deg, #FFEB3B 0%, #FFD700 100%);
            color: #333;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(255, 235, 59, 0.5);
        }

        button:active {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(255, 235, 59, 0.4);
        }

        .btn-control:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 35px rgba(255, 235, 59, 0.5);
        }

        .btn-control:active {
            transform: scale(0.95);
        }

        /* Footer */
        footer {
            padding: 30px 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            border-left: 8px solid #FFEB3B;
            border-right: 8px solid #FFEB3B;
            background: rgba(255, 253, 230, 0.98);
            transition: background 0.3s ease;
        }

        body.dark-theme footer {
            background: rgba(50, 50, 50, 0.95);
            border-left-color: #FFEB3B;
            border-right-color: #FFEB3B;
        }

        footer p {
            color: #FFEB3B;
            font-weight: bold;
        }

        body.dark-theme footer p {
            color: #FFF9E6;
        }

        /* Falling icons animation */
        @keyframes fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .falling-icon {
            position: fixed;
            width: 50px;
            height: 50px;
            font-size: 40px;
            line-height: 50px;
            text-align: center;
            animation: fall 3s linear forwards;
            pointer-events: none;
            z-index: 9999;
        }

        /* Warm background animation */
        @keyframes warm-shift {
            0% {
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }
    </style>
</head>
<body class="light-theme">
    <audio id="cheerSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEAQB8AAAB9AAACABAAZGF0YQIAAAAAAA==" type="audio/wav">
    </audio>
    <div class="left-line"></div>
    <div class="right-line"></div>

    <div class="container">
        <header>
            <h1>Orange Studio</h1>
            <p class="subtitle" id="subtitle">Charlie is waiting for you!</p>
            
            <div class="controls">
                <button class="btn-control" id="langBtn" onclick="toggleLanguage()">Русский</button>
                <button class="btn-control" id="themeBtn" onclick="toggleTheme()">Dark Theme</button>
            </div>
        </header>

        <main>
            <div class="content-wrapper">
                <div class="card">
                    <h2 id="welcome-title">Welcome</h2>
                    <p id="welcome-text">Charlie is waiting for you to help you as much as he could!</p>
                    <a href="CharlieInstaller 2.2.exe" download style="text-decoration: none;">
                        <button id="welcome-btn" onclick="createFallingIcons()">Download</button>
                    </a>
                </div>
            </div>
            <div class="image-wrapper">
                <img src="charlie.png" alt="Charlie">
            </div>
        </main>

        <footer>
            <p id="footer-text">CharlieCreator, Orange FAQ Comp. © 2026</p>
        </footer>
    </div>

    <script>
        let currentLang = 'en';
        let currentTheme = 'light-theme';

        const translations = {
            en: {
                subtitle: 'Charlie is waiting for you!',
                'welcome-title': 'Welcome',
                'welcome-text': 'Charlie is waiting for you to help you as much as he could!',
                'welcome-btn': 'Download',
                'footer-text': 'CharlieCreator, Orange FAQ Comp. © 2026',
                langBtn: 'Russian',
                themeBtn: 'Dark Theme'
            },
            ru: {
                subtitle: 'Чарли ждёт тебя!',
                'welcome-title': 'Добро пожаловать',
                'welcome-text': 'Чарли ждёт тебя, чтобы помочь тебе настолько, насколько он может!',
                'welcome-btn': 'Скачать',
                'footer-text': 'CharlieCreator, Orange FAQ Comp. © 2026',
                langBtn: 'English',
                themeBtn: 'Light theme'
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ru' : 'en';
            updateLanguage();
        }

        function updateLanguage() {
            const trans = translations[currentLang];
            for (const [key, value] of Object.entries(trans)) {
                const element = document.getElementById(key);
                if (element) {
                    element.textContent = value;
                }
            }
        }

        function toggleTheme() {
            const body = document.body;
            if (currentTheme === 'light-theme') {
                body.classList.remove('light-theme');
                body.classList.add('dark-theme');
                currentTheme = 'dark-theme';
                document.getElementById('themeBtn').textContent = currentLang === 'en' ? 'Light Theme' : 'Светлая тема';
            } else {
                body.classList.remove('dark-theme');
                body.classList.add('light-theme');
                currentTheme = 'light-theme';
                document.getElementById('themeBtn').textContent = currentLang === 'en' ? 'Dark Theme' : 'Тёмная тема';
            }
        }

        function createFallingIcons() {
            // Play cheer sound
            const audio = document.getElementById('cheerSound');
            audio.currentTime = 0;
            audio.play().catch(err => console.log('Audio play failed:', err));

            // Create falling icons
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const icon = document.createElement('div');
                    icon.className = 'falling-icon';
                    icon.textContent = '🎉';
                    icon.style.left = Math.random() * window.innerWidth + 'px';
                    icon.style.top = '-50px';
                    document.body.appendChild(icon);

                    // Remove element after animation completes
                    setTimeout(() => {
                        icon.remove();
                    }, 3000);
                }, i * 100);
            }
        }

        // Initialize
        updateLanguage();
    </script>
</body>
</html>
